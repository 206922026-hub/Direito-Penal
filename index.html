<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Interativo de Questões - Sursis Penal e Processual</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --correct-bg: #064e3b;
            --correct-border: #10b981;
            --correct-text: #a7f3d0;
            --incorrect-bg: #7f1d1d;
            --incorrect-border: #ef4444;
            --incorrect-text: #fecaca;
            --accent: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
        }

        header h1 {
            font-size: 1.6rem;
            color: #60a5fa;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .badge {
            background: var(--primary);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }

        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        .question-num {
            font-weight: bold;
            color: var(--accent);
            font-size: 1.1rem;
        }

        .question-topic {
            font-size: 0.8rem;
            background: #334155;
            padding: 3px 8px;
            border-radius: 4px;
            color: #cbd5e1;
        }

        .statement {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #e2e8f0;
            white-space: pre-line;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 14px 18px;
            border-radius: 8px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            line-height: 1.4;
        }

        .option-btn:hover:not(:disabled) {
            background: #1e293b;
            border-color: var(--primary);
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-letter {
            font-weight: bold;
            background: var(--card-border);
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
            font-size: 0.85rem;
        }

        /* Classes de feedback */
        .option-btn.selected-correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
            color: var(--correct-text);
        }

        .option-btn.selected-correct .option-letter {
            background-color: var(--correct-border);
            color: #042f2e;
        }

        .option-btn.selected-incorrect {
            background-color: var(--incorrect-bg);
            border-color: var(--incorrect-border);
            color: var(--incorrect-text);
        }

        .option-btn.selected-incorrect .option-letter {
            background-color: var(--incorrect-border);
            color: #450a0a;
        }

        .option-btn.show-correct-target {
            border: 2px dashed var(--correct-border);
        }

        /* Explicação */
        .explanation {
            display: none;
            background: #0f172a;
            border-left: 4px solid var(--primary);
            padding: 18px;
            border-radius: 0 8px 8px 0;
            margin-top: 20px;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .explanation.visible {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        .explanation h4 {
            color: #60a5fa;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .explanation .correct-reason {
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--card-border);
            color: #a7f3d0;
        }

        .explanation .incorrect-reasons h5 {
            color: var(--accent);
            margin: 10px 0 5px 0;
            font-size: 0.9rem;
        }

        .explanation .incorrect-reasons ul {
            list-style: none;
            padding-left: 0;
        }

        .explanation .incorrect-reasons li {
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .explanation .incorrect-reasons li strong {
            color: #fca5a5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Simulado Interativo Avançado</h1>
        <p>Tema: Suspensão Condicional da Pena (Sursis Penal) & Sursis Processual</p>
    </header>

    <div class="stats-bar">
        <div>Respondidas: <span id="answered-count" class="badge">0 / 20</span></div>
        <div>Acertos: <span id="score" class="badge" style="background: var(--correct-border);">0</span></div>
    </div>

    <div id="quiz-container"></div>
</div>

<script>
const quizData = [
    {
        id: 1,
        topic: "Conceito & Sistemas Penais",
        statement: "No que concerne aos sistemas e à natureza jurídica do sursis penal, assinale a afirmativa correta:",
        options: [
            { id: "A", text: "O Brasil adotou o Sistema Anglo-Americano (Probation System), no qual o juiz suspende o pronunciamento da sentença condenatória." },
            { id: "B", text: "Trata-se de uma faculdade discricionária do juiz, não constituindo direito subjetivo do réu ainda que preenchidos os requisitos." },
            { id: "C", text: "O Brasil adotou o Sistema Franco-Belga para o sursis penal, no qual há prolação da sentença e imposição da pena, suspendendo-se sua execução." },
            { id: "D", text: "O sursis processual (art. 89 da Lei 9.099/95) é idêntico ao sistema franco-belga, pois pressupõe sentença condenatória transitada em julgado." }
        ],
        correct: "C",
        reasonCorrect: "No Brasil, adota-se o Sistema Franco-Belga para o sursis penal (art. 77 do CP): o réu é processado, condenado e a pena privativa de liberdade é fixada, ficando apenas a sua execução suspensa durante o período de prova.",
        reasonsIncorrect: {
            "A": "Incorreta. O Sistema Anglo-Americano suspende o próprio julgamento/sentença. O Brasil adotou o sistema Franco-Belga no CP.",
            "B": "Incorreta. O sursis é direito público subjetivo do condenado, devendo ser concedido desde que preenchidos todos os requisitos legais (Art. 157 da LEP).",
            "D": "Incorreta. O sursis processual (Lei 9.099/95) inspira-se no Probation of First Offender Act, ocorrendo ANTES da instrução e sem prolacão de sentença condenatória."
        }
    },
    {
        id: 2,
        topic: "Requisitos Objetivos & Subjetivos",
        statement: "Considere que João foi condenado à pena privativa de liberdade de 1 ano e 8 meses de reclusão. Sobre os requisitos para a concessão do sursis (art. 77 do CP), analise as afirmativas:

I. Se a pena privativa de liberdade puder ser substituída por pena restritiva de direitos (art. 44, CP), o sursis não será aplicável em razão do seu caráter subsidiário.
II. A reincidência em crime culposo impede expressamente a concessão do sursis penal.
III. Condenação anterior à pena de multa isolada não impede a concessão do sursis.

Está correto o que se afirma em:",
        options: [
            { id: "A", text: "I, apenas." },
            { id: "B", text: "I e III, apenas." },
            { id: "C", text: "II e III, apenas." },
            { id: "D", text: "I, II e III." }
        ],
        correct: "B",
        reasonCorrect: "A afirmativa I está correta (o sursis tem caráter subsidiário à substituição por PRD, nos termos do art. 77, III, CP). A afirmativa III está correta, pois a vedação do art. 77, I, CP aplica-se apenas à reincidência em crime doloso; a condenação anterior a multa não impede a concessão (§ 1º do art. 77).",
        reasonsIncorrect: {
            "A": "Incorreta. A afirmativa III também está correta.",
            "C": "Incorreta. A afirmativa II está errada, pois a reincidência em crime CULPOSO NÃO impede o sursis.",
            "D": "Incorreta. A afirmativa II é falsa."
        }
    },
    {
        id: 3,
        topic: "Espécies de Sursis",
        statement: "Geraldo, com 73 anos de idade na data da prolação da sentença, foi condenado à pena privativa de liberdade de 3 anos e 6 meses de reclusão por crime doloso. Preenchidos os requisitos subjetivos favoráveis e verificada a impossibilidade de substituição por pena restritiva de direitos, o juiz poderá conceder o sursis:",
        options: [
            { id: "A", text: "Simples, com período de prova de 2 a 4 anos." },
            { id: "B", text: "Especial, com período de prova de 2 a 4 anos." },
            { id: "C", text: "Etário, com período de prova de 4 a 6 anos." },
            { id: "D", text: "Humanitário, com período de prova de 2 a 4 anos." }
        ],
        correct: "C",
        reasonCorrect: "O sursis etário (art. 77, § 2º, CP) permite a suspensão da pena privativa de liberdade superior a 2 anos e não superior a 4 anos se o condenado for maior de 70 anos na data da sentença. Nesses casos (pena > 2 anos), o período de prova é de 4 a 6 anos.",
        reasonsIncorrect: {
            "A": "Incorreta. O sursis simples limita-se a penas não superiores a 2 anos (período de prova de 2 a 4 anos).",
            "B": "Incorreta. O sursis especial também exige pena fixada até 2 anos.",
            "D": "Incorreta. O sursis humanitário aplica-se por razões de saúde e, quando a pena for entre 2 e 4 anos, seu período de prova também será de 4 a 6 anos."
        }
    },
    {
        id: 4,
        topic: "Condições Legais (Simples vs. Especial)",
        statement: "Maria, Delegada de Polícia, concluiu inquérito policial, remetendo-o ao Ministério Público, com o indiciamento de Carlos pela prática de crime no contexto da Lei Maria da Penha.
Recebida a denúncia pelo juízo competente, o advogado constituído pelo acusado lhe afirmou que, em caso de condenação, consideradas as circunstâncias do caso apresentado, possivelmente haverá a suspensão condicional da pena.
De acordo com a narrativa e considerando as disposições do Código Penal, analise as afirmativas a seguir.

I. No primeiro ano do prazo, deverá o condenado prestar serviços à comunidade ou submeter-se à limitação de fim de semana. Contudo, se o agente houver reparado o dano, salvo impossibilidade de fazê-lo, e se as circunstâncias judiciais lhe forem inteiramente favoráveis, o Juiz poderá substituir a referida exigência pelas seguintes condições, aplicadas cumulativa ou alternativamente: proibição de frequentar determinados lugares; proibição de ausentar-se da comarca em que reside sem autorização do Juiz; comparecimento pessoal e obrigatório a Juízo, mensalmente, para informar e justificar suas atividades.
II. A sentença poderá especificar outras condições a que fica subordinada a suspensão, desde que adequadas ao fato e à situação pessoal do condenado.
III. A suspensão será revogada se, no curso do período de prova, o beneficiário for condenado, em sentença irrecorrível, por crime doloso ou culposo, facultando-se a revogação do benefício em caso de condenação irrecorrível por contravenção penal.

Nesse cenário, considerando as disposições do Código Penal, está correto o que se afirma em:",
        options: [
            { id: "A", text: "I, apenas." },
            { id: "B", text: "II, apenas." },
            { id: "C", text: "III, apenas." },
            { id: "D", text: "I e II, apenas." }
        ],
        correct: "D",
        reasonCorrect: "As afirmativas I e II estão corretas (reproduzem fielmente o art. 78, §§ 1º e 2º, e o art. 79 do CP). A afirmativa III está errada porque a condenação por crime CULPOSO gera revogação FACULTATIVA, e não obrigatória.",
        reasonsIncorrect: {
            "A": "Incorreta. A afirmativa II também está correta nos termos do art. 79 do CP.",
            "B": "Incorreta. A afirmativa I também está correta nos termos do art. 78, §§ 1º e 2º do CP.",
            "C": "Incorreta. A afirmativa III confunde as causas de revogação obrigatória e facultativa. Crime culposo enseja revogação facultativa (art. 81, § 1º, CP)."
        }
    },
    {
        id: 5,
        topic: "Direitos Indisponíveis & Condições Judiciais",
        statement: "Ao conceder o sursis penal a um sentenciado, o magistrado fixou, como condição judicial substitutiva/adicional (art. 79 do CP), a obrigação de o condenado realizar doação de sangue quadrimestral e de não portar armas de fogo. À luz da jurisprudência e da doutrina penal, tais condições impostas são:",
        options: [
            { id: "A", text: "Válidas, pois o art. 79 concede ampla margem de discricionariedade ao juiz." },
            { id: "B", text: "Inválidas, pois a doação de sangue é ilícita por violar direito indisponível à integridade física, e a proibição de portar armas é condição ociosa/redundante, já imposta pela lei penal geral." },
            { id: "C", text: "Válidas apenas no tocante à doação de sangue, por seu relevante caráter social." },
            { id: "D", text: "Inválidas apenas em relação ao porte de armas, sendo a doação de sangue perfeitamente admissível." }
        ],
        correct: "B",
        reasonCorrect: "Condições judiciais (art. 79, CP) não podem violar direitos indisponíveis (como a integridade física/corpo na doação de sangue forçada) e nem constituir obrigações ociosas/redundantes (proibição de condutas que já são deveres legais gerais).",
        reasonsIncorrect: {
            "A": "Incorreta. A discricionariedade do art. 79 do CP encontra limites nos direitos fundamentais e no princípio da legalidade.",
            "C": "Incorreta. O corpo humano é bem indisponível, não podendo ser objeto de coerção estatal judicial como condição de sursis.",
            "D": "Incorreta. Ambas as condições fixadas extrapolam os limites legais e doutrinários do art. 79 do CP."
        }
    },
    {
        id: 6,
        topic: "Reincidência e Cumulação de Institutos",
        statement: "Finda a instrução processual penal, Matheus, reincidente em crime culposo, foi condenado pela prática de determinada infração penal às penas finais de três anos de reclusão, sendo certo que a culpabilidade, os antecedentes, a conduta social e a personalidade do agente, bem como os motivos e as circunstâncias, lhe são benéficos. Constata-se, ainda, não ser cabível a substituição da pena privativa de liberdade por pena restritiva de direitos e que o condenado, que respondeu ao processo em liberdade, possui setenta e dois anos de idade.

            "C": "Incorreta. Reincidência em crime culposo não obsta o sursis (art. 77, I, CP)."
        }
    },
    {

        topic: "Prazos do Período de Prova",

            { id: "B", text: "Sursis Etário com pena fixada em 3 anos: Período de prova de 4 a 6 anos." },

        correct: "B",

            { id: "B", text: "Poderá facultativamente revogar o sursis ou prorrogar o prazo de prova." },

        correct: "A",

        reasonsIncorrect: {

let answeredCount = 0;
let score = 0;

function renderQuiz() {
    const container = document.getElementById("quiz-container");
    container.innerHTML = "";

    quizData.forEach((q, index) => {
        const card = document.createElement("div");
        card.className = "question-card";
        card.id = `q-${index}`;

        let optionsHTML = "";
        q.options.forEach(opt => {
            optionsHTML += `
                <button class="option-btn" data-q="${index}" data-opt="${opt.id}" onclick="handleSelect(${index}, '${opt.id}')">
                    <span class="option-letter">${opt.id}</span>
                    <span>${opt.text}</span>
                </button>
            `;
        });

        let incorrectListHTML = "";
        for (const [key, val] of Object.entries(q.reasonsIncorrect)) {
            incorrectListHTML += `<li><strong>Alternativa ${key}:</strong> ${val}</li>`;
        }

        card.innerHTML = `
            <div class="question-header">
                <span class="question-num">Questão ${q.id} de 20</span>
                <span class="question-topic">${q.topic}</span>
            </div>
            <div class="statement">${q.statement}</div>
            <div class="options">${optionsHTML}</div>
            <div class="explanation" id="exp-${index}">
                <h4>Fundamentação & Análise Detalhada</h4>
                <div class="correct-reason">
                    <strong>RESPOSTA CORRETA (${q.correct}):</strong> ${q.reasonCorrect}
                </div>
                <div class="incorrect-reasons">
                    <h5>Análise das Alternativas Incorretas:</h5>
                    <ul>${incorrectListHTML}</ul>
                </div>
            </div>
        `;

        container.appendChild(card);
    });
}

function handleSelect(questionIndex, selectedOption) {
    const q = quizData[questionIndex];
    const card = document.getElementById(`q-${questionIndex}`);
    const buttons = card.querySelectorAll(".option-btn");
    const exp = document.getElementById(`exp-${questionIndex}`);

    // Desabilita botões desta questão
    buttons.forEach(btn => {
        btn.disabled = true;
        const optId = btn.getAttribute("data-opt");
        if (optId === q.correct) {
            btn.classList.add("show-correct-target");
        }
    });

    const selectedBtn = card.querySelector(`[data-opt="${selectedOption}"]`);

    if (selectedOption === q.correct) {
        selectedBtn.classList.add("selected-correct");
        score++;
    } else {
        selectedBtn.classList.add("selected-incorrect");
    }

    answeredCount++;
    document.getElementById("answered-count").innerText = `${answeredCount} / 20`;
    document.getElementById("score").innerText = score;

    exp.classList.add("visible");
}

document.addEventListener("DOMContentLoaded", renderQuiz);
</script>
