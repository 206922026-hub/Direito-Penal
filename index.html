<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widget Interativo de Estudo - LEP</title>
<style>
    :root {
        --primary: #2C3E50;
        --secondary: #34495E;
        --accent: #3498DB;
        --success: #27AE60;
        --error: #E74C3C;
        --bg-color: #ECF0F1;
        --text-color: #333;
        --card-bg: #FFFFFF;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; padding: 20px; }
    
    .widget-container {
        background-color: var(--card-bg); width: 100%; max-width: 800px;
        border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); overflow: hidden;
    }
    
    .header { background-color: var(--primary); color: white; padding: 20px; text-align: center; }
    .header h1 { font-size: 1.5rem; margin-bottom: 5px; }
    .header p { font-size: 0.9rem; opacity: 0.8; }
    
    .progress-bar { width: 100%; background-color: #e0e0e0; height: 6px; }
    .progress-fill { background-color: var(--accent); height: 100%; width: 0%; transition: width 0.3s; }
    
    .content { padding: 30px 20px; }
    
    .status-row { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 20px; font-size: 0.9rem; color: var(--secondary); }
    
    .question-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 25px; line-height: 1.5; color: var(--primary); }
    
    .options-container { display: flex; flex-direction: column; gap: 12px; }
    
    .option {
        background-color: var(--bg-color); border: 2px solid transparent; border-radius: 8px;
        padding: 15px; cursor: pointer; transition: all 0.2s; font-size: 1rem; line-height: 1.4;
    }
    .option:hover:not(.disabled) { background-color: #D6DBDF; }
    
    .option.disabled { cursor: not-allowed; }
    .option.selected-correct { border-color: var(--success); background-color: #EAFAF1; }
    .option.selected-incorrect { border-color: var(--error); background-color: #FDEDEC; }
    .option.show-correct { border-color: var(--success); background-color: #EAFAF1; }
    
    .feedback-container {
        margin-top: 25px; padding: 20px; border-radius: 8px; display: none;
        background-color: #F8F9F9; border-left: 5px solid var(--accent);
    }
    .feedback-container h3 { margin-bottom: 10px; font-size: 1.1rem; }
    .feedback-item { margin-bottom: 12px; font-size: 0.95rem; line-height: 1.5; padding-bottom: 12px; border-bottom: 1px solid #E5E8E8; }
    .feedback-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; color: white; margin-right: 8px; display: inline-block; width: 25px; text-align: center; }
    .badge-v { background-color: var(--success); }
    .badge-f { background-color: var(--error); }
    
    .btn-next {
        display: none; width: 100%; padding: 15px; margin-top: 25px;
        background-color: var(--accent); color: white; border: none;
        border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
        transition: background 0.2s;
    }
    .btn-next:hover { background-color: #2980B9; }
    
    .result-screen { display: none; text-align: center; padding: 40px 20px; }
    .result-screen h2 { font-size: 2rem; color: var(--primary); margin-bottom: 15px; }
    .result-screen p { font-size: 1.2rem; margin-bottom: 25px; }
    .btn-restart { background-color: var(--success); padding: 15px 30px; color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; font-weight: bold; }
    
    @media (max-width: 600px) {
        .content { padding: 20px 15px; }
        .question-text { font-size: 1.1rem; }
    }
</style>
</head>
<body>

<div class="widget-container">
    <div class="header">
        <h1>Simulado: Lei de Execução Penal</h1>
        <p>Nível Avançado - Baseado em Jurisprudências e Atualizações (Leis 14.843/24 e 14.994/24)</p>
    </div>
    
    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
    
    <div class="content" id="quiz-content">
        <div class="status-row">
            <span id="q-counter">Questão 1 de 20</span>
            <span id="score-counter">Acertos: 0</span>
        </div>
        
        <div class="question-text" id="question-text">Carregando questão...</div>
        
        <div class="options-container" id="options-container">
            <!-- Options generated by JS -->
        </div>
        
        <div class="feedback-container" id="feedback-container">
            <h3 id="feedback-title">Justificativas:</h3>
            <div id="feedback-content">
                <!-- Feedback generated by JS -->
            </div>
        </div>
        
        <button class="btn-next" id="btn-next">Próxima Questão</button>
    </div>
    
    <div class="result-screen" id="result-screen">
        <h2>Simulado Concluído!</h2>
        <p id="final-score">Você acertou X de 20 questões.</p>
        <button class="btn-restart" id="btn-restart">Refazer Simulado</button>
    </div>
</div>

<script>
const quizData = [
    {
        question: "Sobre a aplicação da Lei de Execução Penal (LEP) e sua natureza jurídica, assinale a alternativa correta:",
        options: [
            { id: "A", text: "Aplica-se aos presos provisórios, garantindo-se a execução provisória da pena após acórdão de 2ª instância.", correct: false, rationale: "O material destaca expressamente que NÃO há execução provisória da pena no Brasil (ADCs 43, 44 e 54/STF)." },
            { id: "B", text: "Não se aplica aos condenados pela Justiça Eleitoral, os quais possuem regramento próprio em presídios eleitorais.", correct: false, rationale: "O texto afirma que a LEP aplica-se ao condenado pela Justiça Eleitoral ou Militar recolhido a estabelecimento sujeito à jurisdição ordinária." },
            { id: "C", text: "Aplica-se aos presos provisórios, assegurando direitos básicos, mas a doutrina reconhece natureza mista da execução penal, envolvendo atos jurisdicionais e administrativos.", correct: true, rationale: "Exatamente o disposto no material base: aplica-se no que couber ao preso provisório, e sua natureza é mista (ou complexa)." },
            { id: "D", text: "A execução penal tem natureza exclusivamente administrativa, a cargo do Poder Executivo.", correct: false, rationale: "A doutrina majoritária reconhece a natureza mista (jurisdicional e administrativa)." }
        ]
    },
    {
        question: "Com base nas novidades legislativas recentes (Pacote Anticrime e Lei 14.994/24) sobre competência e processo de execução, assinale a opção correta:",
        options: [
            { id: "A", text: "A multa penal passou a ser executada na Vara da Fazenda Pública pela Procuradoria do Estado.", correct: false, rationale: "A multa passou a ser executada na Vara de Execução Penal como dívida de valor, com legitimidade exclusiva do Ministério Público." },
            { id: "B", text: "Permite-se a transferência de condenados por violência doméstica contra a mulher para estabelecimento distante da vítima, caso existam ameaças.", correct: true, rationale: "Regra expressa da Lei 14.994/24 constante no material, permitindo transferência inclusive para outro Estado ou presídio federal." },
            { id: "C", text: "A competência territorial da execução é fixada permanentemente pelo local do juízo que proferiu a condenação.", correct: false, rationale: "A competência territorial 'vai atrás' do preso, definida pelo local onde ele estiver preso ou internado." },
            { id: "D", text: "Compete à Justiça Federal a execução de pena imposta por ela, mesmo que o preso seja recolhido a presídio estadual.", correct: false, rationale: "A Súmula 192/STJ define que compete ao juízo estadual a execução nestes casos." }
        ]
    },
    {
        question: "Em relação aos direitos e deveres do preso e as disposições recentes, é correto afirmar:",
        options: [
            { id: "A", text: "O rol de deveres e o rol de direitos do preso são taxativos (numerus clausus).", correct: false, rationale: "O rol de deveres é taxativo, mas o de direitos é exemplificativo (numerus apertus)." },
            { id: "B", text: "O trabalho do preso é remunerado e regido pelas normas da Consolidação das Leis do Trabalho (CLT).", correct: false, rationale: "O material afirma que o trabalho não é inferior a 3/4 do salário-mínimo, SEM vínculo CLT." },
            { id: "C", text: "O condenado por crime contra a mulher por razões da condição do sexo feminino não poderá usufruir da visita íntima ou conjugal.", correct: true, rationale: "Regra direta da Lei 14.994/24 listada nas exceções sobre visitas." },
            { id: "D", text: "A restrição de direitos do preso pode ser feita por ato discricionário exclusivo do diretor do presídio.", correct: false, rationale: "A Lei 14.994/24 estabelece a Garantia de Jurisdicionalidade: a suspensão/restrição deve ser feita por ato motivado do Juiz." }
        ]
    },
    {
        question: "Segundo a LEP e a jurisprudência sumulada do STJ em relação à disciplina penitenciária, configura falta grave:",
        options: [
            { id: "A", text: "A fuga, a recusa justificada ao trabalho imposto e o uso de celular.", correct: false, rationale: "A recusa ao trabalho que configura falta grave é a recusa INJUSTIFICADA (HC 262.989/STJ)." },
            { id: "B", text: "Apenas a posse do aparelho celular íntegro e periciado, sendo atípica a posse exclusiva de chip.", correct: false, rationale: "Súmula 660/STJ: a simples posse de componentes (chip, fone) configura falta, e a Súmula 661/STJ dispensa perícia." },
            { id: "C", text: "A simples posse de uma bateria de celular ou fone de ouvido na cela, independentemente de perícia do aparelho.", correct: true, rationale: "Conforme Súmulas 660 e 661/STJ referenciadas no material de apoio." },
            { id: "D", text: "O descumprimento das condições do regime fechado, sendo atípico para regime aberto ou PRD.", correct: false, rationale: "O descumprimento das condições do regime aberto ou da PRD (Art. 51) configura falta grave." }
        ]
    },
    {
        question: "O cometimento de falta grave gera severas consequências ao apenado. Assinale a alternativa que descreve corretamente um de seus efeitos:",
        options: [
            { id: "A", text: "Interrompe o prazo para a obtenção de Livramento Condicional, Indulto e Progressão de Regime.", correct: false, rationale: "Interrompe apenas a Progressão de Regime (Súm. 534). NÃO interrompe Livramento (Súm. 441) nem Indulto (Súm. 535)." },
            { id: "B", text: "Gera a perda integral dos dias remidos anteriormente pelo trabalho ou estudo.", correct: false, rationale: "Gera a perda de ATÉ 1/3 dos dias remidos, cabendo ao juiz motivar o patamar (Súmula Vinculante 9/STF)." },
            { id: "C", text: "Zera a contagem (interrompe o prazo) exclusivamente para o benefício de Progressão de Regime.", correct: true, rationale: "Conforme Súmula 534/STJ e as vedações de interrupção para os demais institutos no material." },
            { id: "D", text: "O diretor do presídio pode aplicar a perda de dias remidos sem necessidade de manifestação judicial.", correct: false, rationale: "A perda exige decisão fundamentada do juiz, que tem discricionariedade limitada a 1/3." }
        ]
    },
    {
        question: "Sobre o Procedimento Administrativo Disciplinar (PAD) para apuração de faltas, é correto afirmar com base na jurisprudência do STF:",
        options: [
            { id: "A", text: "O PAD é indispensável e absoluto, não podendo ser suprido por qualquer outro ato processual.", correct: false, rationale: "Segundo o Tema 941/STF, a oitiva do preso pelo Juiz supre a ausência do PAD." },
            { id: "B", text: "A oitiva do preso pelo Juiz em audiência de justificação, com advogado e MP, supre a ausência do PAD.", correct: true, rationale: "Essa é a redação exata do entendimento do Tema 941/STF listado no material." },
            { id: "C", text: "As faltas médias e leves, assim como as graves, exigem PAD definido exclusivamente pela LEP.", correct: false, rationale: "As faltas leves e médias são definidas pela legislação local, não exclusivamente pela LEP." },
            { id: "D", text: "A falta grave dispensa ampla defesa se comprovada por flagrante no interior da cela.", correct: false, rationale: "O PAD (ou a audiência de justificação em juízo) é exigido para aplicar a sanção de falta grave." }
        ]
    },
    {
        question: "A Lei 14.843/24 trouxe profunda alteração nos requisitos para a Progressão de Regime. Segundo as novas regras, o Exame Criminológico:",
        options: [
            { id: "A", text: "Tornou-se obrigatório para todos os casos de progressão, superando o entendimento anterior da Súmula 439/STJ.", correct: true, rationale: "O material destaca como mudança crítica: o exame criminológico passou a ser obrigatório para todos os casos de progressão." },
            { id: "B", text: "Permanece facultativo, necessitando de decisão fundamentada do juiz da execução (Súmula 439/STJ).", correct: false, rationale: "A Súmula 439/STJ foi superada para fatos posteriores à Lei 14.843/24." },
            { id: "C", text: "É obrigatório apenas para condenados por crimes hediondos com resultado morte.", correct: false, rationale: "A obrigatoriedade se estende a todos os casos de progressão, não se limitando aos hediondos." },
            { id: "D", text: "Quando favorável, autoriza a progressão de regime 'por saltos' (do fechado direto para o aberto).", correct: false, rationale: "O STJ veda expressamente a progressão por saltos (Súmula 491/STJ)." }
        ]
    },
    {
        question: "João é reincidente específico na prática de crime hediondo COM resultado morte. Segundo o Pacote Anticrime, qual fração de pena deverá cumprir para progredir de regime?",
        options: [
            { id: "A", text: "40%", correct: false, rationale: "40% é a fração para hediondo sem morte (Primário)." },
            { id: "B", text: "50%", correct: false, rationale: "50% é para comando de org. criminosa ou hediondo com morte primário." },
            { id: "C", text: "60%", correct: false, rationale: "60% aplica-se a reincidente específico em crime hediondo SEM resultado morte." },
            { id: "D", text: "70%", correct: true, rationale: "Conforme a tabela de progressão do material, Hediondo COM morte (Reincidente específico) exige 70%." }
        ]
    },
    {
        question: "Joana, mãe de criança menor, é condenada primária por crime praticado sem violência ou grave ameaça e não integra facção criminosa. De acordo com a LEP (Lei 13.769/18), sua progressão ocorrerá após cumprimento de:",
        options: [
            { id: "A", text: "16% da pena.", correct: false, rationale: "Essa seria a regra geral para primário sem violência, mas mães nas condições descritas possuem regra especial." },
            { id: "B", text: "1/8 da pena.", correct: true, rationale: "O material alerta para prova: gestantes ou mães progridem com 1/8 desde que primárias, sem violência, sem crime contra o filho e sem elo com facção." },
            { id: "C", text: "25% da pena.", correct: false, rationale: "25% aplica-se a primário com crime envolvendo violência ou grave ameaça." },
            { id: "D", text: "1/6 da pena.", correct: false, rationale: "Essa fração era a regra antiga geral e hoje é usada como limite de tempo para saídas temporárias (primários), mas não para a progressão especial de mães." }
        ]
    },
    {
        question: "Sobre as Autorizações de Saída (Permissão de Saída vs. Saída Temporária), é correto afirmar que:",
        options: [
            { id: "A", text: "Ambas exigem escolta policial obrigatória contínua.", correct: false, rationale: "Saída temporária é SEM vigilância direta (podendo usar tornozeleira). Apenas permissão de saída tem escolta sempre." },
            { id: "B", text: "A saída temporária é concedida pelo Juiz da Execução para visitas à família, sendo admissível no regime fechado e semiaberto.", correct: false, rationale: "Saída temporária é cabível APENAS no regime semiaberto." },
            { id: "C", text: "A permissão de saída é autorizada pelo Diretor do Estabelecimento, mediante escolta, por motivo de falecimento/doença de familiar ou tratamento médico.", correct: true, rationale: "Exatamente as características listadas na tabela do material para Permissão de Saída (Art. 120 LEP)." },
            { id: "D", text: "A saída temporária não exige cumprimento mínimo de tempo de pena, diferentemente da permissão de saída.", correct: false, rationale: "É o inverso: saída temporária exige 1/6 (primário) ou 1/4 (reincidente), enquanto a permissão não exige tempo mínimo." }
        ]
    },
    {
        question: "A Lei 14.843/24 alterou profundamente a sistemática da Saída Temporária. Assinale a regra atual, de acordo com o material:",
        options: [
            { id: "A", text: "O condenado passou a ter direito incondicional a 5 saídas de 7 dias ao ano.", correct: false, rationale: "A regra de '5 saídas de 7 dias' foi expressamente revogada. O juiz define a duração exata agora." },
            { id: "B", text: "É expressamente VEDADA a saída temporária para condenados por crimes hediondos ou praticados com violência/grave ameaça contra a pessoa.", correct: true, rationale: "Essa é a mudança crítica apontada no material (Lei 14.843/24)." },
            { id: "C", text: "A saída temporária exige, em todos os casos, autorização do Diretor do Presídio e manifestação do Ministério Público.", correct: false, rationale: "A autorização da saída temporária é do Juiz da Execução, não do Diretor." },
            { id: "D", text: "Estar no regime semiaberto garante ao condenado o direito automático à saída temporária.", correct: false, rationale: "O STF firmou tese de que estar no semiaberto não dá direito automático (HC 102.773)." }
        ]
    },
    {
        question: "Sobre a Remição de Pena disciplinada na LEP, assinale a correta:",
        options: [
            { id: "A", text: "Remição pelo trabalho exige 1 dia remido a cada 2 dias trabalhados, permitida apenas no regime fechado.", correct: false, rationale: "É 1 dia a cada 3 dias de trabalho, permitida no fechado E no semiaberto." },
            { id: "B", text: "Remição pelo estudo ocorre na proporção de 1 dia de pena para cada 12 horas de frequência escolar.", correct: true, rationale: "Regra expressa de proporção de estudo (1 dia a cada 12 horas) presente no material." },
            { id: "C", text: "A conclusão do ensino médio durante o cumprimento da pena permite o acréscimo de 1/6 no tempo remido.", correct: false, rationale: "O acréscimo (bônus) de conclusão de ensino é de 1/3 do tempo remido, não 1/6." },
            { id: "D", text: "O STJ, por falta de previsão legal expressa, veda terminantemente a remição pela leitura.", correct: false, rationale: "O material informa que o STJ admite a remição pela leitura e elaboração de resenhas." }
        ]
    },
    {
        question: "Acerca do Agravo em Execução, recurso aplicável nesta fase processual:",
        options: [
            { id: "A", text: "Possui prazo de 15 dias, seguindo o rito da Apelação, sem juízo de retratação.", correct: false, rationale: "O prazo é de 5 dias e segue o rito do Recurso em Sentido Estrito (RESE)." },
            { id: "B", text: "Em regra, possui efeito suspensivo automático para todas as decisões.", correct: false, rationale: "Em regra, NÃO possui efeito suspensivo. A exceção é recurso do MP contra desinternação de medida de segurança." },
            { id: "C", text: "Cabe contra as decisões do Juiz da Execução Penal, tem prazo de 5 dias (Súm. 700/STF) e admite juízo de retratação.", correct: true, rationale: "O recurso segue o rito do RESE, tem prazo de 5 dias e admite juízo de retratação, sendo cabível contra todas as decisões do Juiz da Execução." },
            { id: "D", text: "Pode ser interposto contra decisões disciplinares do Diretor do Presídio diretamente ao Tribunal.", correct: false, rationale: "Cabe contra decisões do Juiz da Execução Penal." }
        ]
    },
    {
        question: "Quanto à Monitoração Eletrônica (tornozeleira), de acordo com a LEP e atualizações:",
        options: [
            { id: "A", text: "Pode ser determinada pelo Diretor do Presídio visando a segurança das saídas temporárias.", correct: false, rationale: "É cabível EXCLUSIVAMENTE por ordem do juiz." },
            { id: "B", text: "É obrigatória para saídas de condenados por violência contra a mulher, conforme Lei 14.994/24.", correct: true, rationale: "Regra explícita inserida pela recente Lei 14.994/24 constante no material." },
            { id: "C", text: "É incabível para o regime aberto, destinando-se unicamente ao regime semiaberto.", correct: false, rationale: "As inovações permitem o uso para penas em regime aberto/semiaberto e livramento condicional." },
            { id: "D", text: "A não conservação do aparelho é tratada como falta leve a ser regulada pelo Estado.", correct: false, rationale: "O texto indica (Lei 14.843/24) que a conservação é um DEVER (Art. 39). Descumprir condições sujeita a sanção grave, não leve." }
        ]
    },
    {
        question: "Em relação ao crime de Feminicídio, qual é a fração de progressão de regime exigida para condenado primário (Lei 14.994/24)?",
        options: [
            { id: "A", text: "40%", correct: false, rationale: "40% é para crimes hediondos sem resultado morte (primário)." },
            { id: "B", text: "50%", correct: false, rationale: "50% aplica-se a hediondo com morte (antes da lei específica) ou comando de milícia." },
            { id: "C", text: "55%", correct: true, rationale: "De acordo com a tabela do Pacote Anticrime atualizada pela Lei 14.994/24, a fração é 55% para primário em Feminicídio." },
            { id: "D", text: "70%", correct: false, rationale: "70% é a fração mais gravosa, reservada para reincidente específico em crime hediondo com morte." }
        ]
    },
    {
        question: "Mévio, cumprindo pena no regime fechado, recusa-se a submeter-se à extração de perfil genético (DNA). Essa conduta:",
        options: [
            { id: "A", text: "É garantida pelo princípio da não autoincriminação e não configura infração disciplinar.", correct: false, rationale: "Segundo o Pacote Anticrime (incluído na LEP), a recusa do DNA configura falta grave." },
            { id: "B", text: "Configura falta média, aplicável após sindicância do diretor da unidade.", correct: false, rationale: "Configura falta GRAVE definida pela LEP." },
            { id: "C", text: "Configura falta grave, implicando regressão de regime se houver procedimento com oitiva do preso ou PAD.", correct: true, rationale: "A recusa do DNA é elencada nas Principais Faltas Graves, cujo procedimento exige PAD (ou oitiva judicial)." },
            { id: "D", text: "Causa a perda automática e integral de todos os dias remidos.", correct: false, rationale: "A perda de dias remidos é de ATÉ 1/3, nunca integral ou automática, dependendo de fundamentação judicial." }
        ]
    },
    {
        question: "Tício, condenado por integrar o comando de organização criminosa, requer progressão de regime. Para este caso, a fração exigida é:",
        options: [
            { id: "A", text: "25%", correct: false, rationale: "25% é para primário com violência ou grave ameaça." },
            { id: "B", text: "40%", correct: false, rationale: "40% é para crime hediondo sem morte (primário)." },
            { id: "C", text: "50%", correct: true, rationale: "Organização Criminosa/Milícia (Comando) exige cumprimento de 50% da pena." },
            { id: "D", text: "60%", correct: false, rationale: "60% é para reincidente específico em crime hediondo sem morte." }
        ]
    },
    {
        question: "Sobre a progressão de regime em crimes contra a Administração Pública:",
        options: [
            { id: "A", text: "Exige o cumprimento de 40% da pena independentemente de reincidência.", correct: false, rationale: "A fração depende da primariedade e violência, mas o requisito subjetivo diferencial é o ressarcimento." },
            { id: "B", text: "Exige-se, como requisito subjetivo especial, o ressarcimento do dano (Tema 772/STF).", correct: true, rationale: "Regra constante nos requisitos subjetivos para Progressão de Regime, conforme entendimento do STF." },
            { id: "C", text: "A lei proíbe a progressão, submetendo o condenado a regime integralmente fechado.", correct: false, rationale: "A progressão é direito subjetivo, não vedada neste caso, mas condicionada ao ressarcimento." },
            { id: "D", text: "A progressão só ocorre após devolução em dobro do montante desviado.", correct: false, rationale: "Exige-se o ressarcimento do dano, mas a lei/texto não menciona 'devolução em dobro'." }
        ]
    },
    {
        question: "Quais dos prazos abaixo NÃO são interrompidos em caso de cometimento de falta grave no curso da execução penal?",
        options: [
            { id: "A", text: "Progressão de regime e autorizações de saída.", correct: false, rationale: "A progressão de regime tem o prazo INTERROMPIDO (zerado) pela falta grave (Súm. 534/STJ)." },
            { id: "B", text: "Prazo para Livramento Condicional e Indulto/Comutação.", correct: true, rationale: "Conforme jurisprudência (Súmulas 441 e 535 do STJ), a falta grave não interrompe esses prazos." },
            { id: "C", text: "Prazo para progressão de regime e remição de pena.", correct: false, rationale: "O prazo da progressão é interrompido. A remição sofre perda de até 1/3." },
            { id: "D", text: "Prazo de prescrição executória e do exame criminológico.", correct: false, rationale: "Não há menção a prescrição executória no texto limitador de interrupções, e o Livramento Condicional e Indulto é a resposta exata." }
        ]
    },
    {
        question: "Os Princípios Fundamentais regem a execução penal. Assinale a correta correspondência baseada no texto fornecido:",
        options: [
            { id: "A", text: "Princípio da Legalidade: admite-se a punição por falta não prevista expressamente se representar ameaça grave ao presídio.", correct: false, rationale: "A Legalidade dispõe exatamente o contrário: não há falta nem sanção sem previsão legal." },
            { id: "B", text: "Princípio da Igualdade: permite a segregação e distinção entre apenados baseada na vertente religiosa.", correct: false, rationale: "O Princípio da Igualdade (Art. 3º, PU) veda distinção racial, social, religiosa ou política." },
            { id: "C", text: "Princípio da Humanidade: assegura o respeito à integridade física e moral dos condenados e presos provisórios.", correct: true, rationale: "Exata definição do Art. 40 da LEP e do princípio da humanidade destacado no material." },
            { id: "D", text: "Princípio da Personalização: uniformiza o cumprimento da pena, vedando adequações às condições pessoais.", correct: false, rationale: "O Princípio da Personalização obriga que a execução seja ADEQUADA (individualizada) às condições pessoais do apenado." }
        ]
    }
];

let currentQIndex = 0;
let score = 0;

const questionTextEl = document.getElementById('question-text');
const optionsContainer = document.getElementById('options-container');
const qCounterEl = document.getElementById('q-counter');
const scoreCounterEl = document.getElementById('score-counter');
const progressFill = document.getElementById('progress-fill');
const btnNext = document.getElementById('btn-next');
const feedbackContainer = document.getElementById('feedback-container');
const feedbackContent = document.getElementById('feedback-content');
const quizContent = document.getElementById('quiz-content');
const resultScreen = document.getElementById('result-screen');
const finalScoreEl = document.getElementById('final-score');
const btnRestart = document.getElementById('btn-restart');

function renderQuestion() {
    const qData = quizData[currentQIndex];
    qCounterEl.textContent = `Questão ${currentQIndex + 1} de ${quizData.length}`;
    progressFill.style.width = `${((currentQIndex) / quizData.length) * 100}%`;
    
    questionTextEl.textContent = `${currentQIndex + 1}. ${qData.question}`;
    optionsContainer.innerHTML = '';
    feedbackContainer.style.display = 'none';
    btnNext.style.display = 'none';
    
    qData.options.forEach((opt, index) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.innerHTML = `<strong>${opt.id})</strong> ${opt.text}`;
        div.onclick = () => handleOptionClick(index);
        optionsContainer.appendChild(div);
    });
}

function handleOptionClick(selectedIndex) {
    const optionsDivs = optionsContainer.children;
    if (optionsDivs[0].classList.contains('disabled')) return; // already answered
    
    const qData = quizData[currentQIndex];
    const isCorrect = qData.options[selectedIndex].correct;
    
    if (isCorrect) score++;
    scoreCounterEl.textContent = `Acertos: ${score}`;
    
    for (let i = 0; i < optionsDivs.length; i++) {
        optionsDivs[i].classList.add('disabled');
        if (i === selectedIndex) {
            optionsDivs[i].classList.add(isCorrect ? 'selected-correct' : 'selected-incorrect');
        }
        if (qData.options[i].correct && i !== selectedIndex) {
            optionsDivs[i].classList.add('show-correct');
        }
    }
    
    renderFeedback(qData, selectedIndex);
    btnNext.style.display = 'block';
    
    if (currentQIndex === quizData.length - 1) {
        btnNext.textContent = 'Ver Resultados';
    }
}

function renderFeedback(qData, selectedIndex) {
    feedbackContent.innerHTML = '';
    qData.options.forEach((opt, idx) => {
        const item = document.createElement('div');
        item.className = 'feedback-item';
        
        const badge = document.createElement('span');
        badge.className = opt.correct ? 'badge badge-v' : 'badge badge-f';
        badge.textContent = opt.correct ? 'V' : 'F';
        
        const label = document.createElement('strong');
        label.textContent = `Alternativa ${opt.id}: `;
        
        const rationale = document.createElement('span');
        rationale.textContent = opt.rationale;
        
        item.appendChild(badge);
        item.appendChild(label);
        item.appendChild(rationale);
        
        if (idx === selectedIndex) {
            item.style.backgroundColor = opt.correct ? '#EAFAF1' : '#FDEDEC';
            item.style.padding = '8px';
            item.style.borderRadius = '5px';
            item.style.marginBottom = '12px';
        }
        
        feedbackContent.appendChild(item);
    });
    feedbackContainer.style.display = 'block';
}

btnNext.onclick = () => {
    currentQIndex++;
    if (currentQIndex < quizData.length) {
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
        showResults();
    }
};

function showResults() {
    quizContent.style.display = 'none';
    resultScreen.style.display = 'block';
    progressFill.style.width = '100%';
    
    const percentage = ((score / quizData.length) * 100).toFixed(0);
    let msg = '';
    if (percentage >= 80) msg = "Excelente domínio da LEP e jurisprudência!";
    else if (percentage >= 60) msg = "Bom resultado, mas requer revisão nos pontos errados.";
    else msg = "Foco na revisão da Decoreba Estratégica e prazos!";
    
    finalScoreEl.innerHTML = `Você acertou <strong>${score}</strong> de ${quizData.length} questões (${percentage}%).<br><br><em>${msg}</em>`;
}

btnRestart.onclick = () => {
    currentQIndex = 0;
    score = 0;
    scoreCounterEl.textContent = `Acertos: 0`;
    quizContent.style.display = 'block';
    resultScreen.style.display = 'none';
    btnNext.textContent = 'Próxima Questão';
    renderQuestion();
};

// Start
renderQuestion();
</script>
